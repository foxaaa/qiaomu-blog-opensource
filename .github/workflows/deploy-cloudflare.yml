name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.CF_D1_DATABASE_ID != '' && vars.CF_R2_BUCKET_NAME != '' && vars.NEXT_PUBLIC_SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate CI Wrangler config
        run: node scripts/prepare-wrangler-config.mjs wrangler.toml wrangler.toml

      - name: Build OpenNext worker
        run: npm run cf:build

      - name: Run tests
        run: npm run test:run

      - name: Deploy worker and update D1
        run: npm run cf:deploy

      - name: Sync worker secrets
        run: node scripts/sync-cloudflare-secrets.mjs
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_TOKEN_SALT: ${{ secrets.ADMIN_TOKEN_SALT }}
          AI_CONFIG_ENCRYPTION_SECRET: ${{ secrets.AI_CONFIG_ENCRYPTION_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
